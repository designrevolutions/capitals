<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital Cities Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efe6d5;
    --bg-dot: #e2d6bf;
    --card: #fffaf0;
    --ink: #22201c;
    --muted: #7a7264;
    --line: #d9ccb2;
    --accent: #d9542b;
    --accent-ink: #fffaf0;
    --good: #2f7d4f;
    --bad: #c2362b;
    --field: #f7efdf;
    --shadow: 0 1px 0 #d4c6aa, 0 18px 40px -18px rgba(70, 50, 20, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1916;
      --bg-dot: #26231f;
      --card: #262320;
      --ink: #f1eadc;
      --muted: #a69d8c;
      --line: #3d3832;
      --accent: #f0794f;
      --accent-ink: #1b1916;
      --good: #5cc488;
      --bad: #ff6f5e;
      --field: #1f1d1a;
      --shadow: 0 1px 0 #11100e, 0 18px 40px -18px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.2px);
    background-size: 18px 18px;
    color: var(--ink);
    font: 16px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Postcard */
  .card {
    position: relative; width: 100%; max-width: 480px;
    background: var(--card); border-radius: 6px; padding: 32px 28px 24px;
    box-shadow: var(--shadow);
    transform: rotate(-.6deg);
  }
  .card::before {           /* airmail stripe */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 8px; border-radius: 6px 6px 0 0;
    background: repeating-linear-gradient(-45deg,
      var(--accent) 0 12px, transparent 12px 20px, #2b5aa8 20px 32px, transparent 32px 40px);
    opacity: .85;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .eyebrow {
    margin: 6px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  .postmark {
    flex: none; width: 74px; height: 74px; border-radius: 50%;
    border: 2px dashed var(--line); display: grid; place-content: center; text-align: center;
    color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    transform: rotate(8deg);
  }
  .postmark b { display: block; font: 800 22px/1 "Fraunces", Georgia, serif; color: var(--ink); letter-spacing: 0; }

  h1 {
    margin: 0 0 24px; font: 800 clamp(30px, 8vw, 42px)/1.08 "Fraunces", Georgia, serif;
    letter-spacing: -.01em; overflow-wrap: anywhere;
  }
  h1 .q { color: var(--accent); }

  form { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  input[type=text]:disabled { opacity: .7; }

  .btn-wrap { position: relative; flex: none; }
  .btn {
    font: 700 16px/1 "DM Sans", system-ui, sans-serif; padding: 14px 20px; min-width: 118px;
    border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000);
    transition: transform .1s, box-shadow .1s, background-color .2s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.good { background: var(--good); box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 60%, #000); }

  /* Result stamp */
  .result-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; min-height: 48px; }
  .stamp {
    flex: none; pointer-events: none;
    font: 800 22px/1 "Fraunces", Georgia, serif; letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 12px; border: 3px solid currentColor; border-radius: 8px;
    opacity: 0;
  }
  .stamp.good { color: var(--good); }
  .stamp.bad { color: var(--bad); }
  .stamp.show { animation: stamp .45s cubic-bezier(.2, .9, .3, 1.3) forwards; }

  .answer-line { margin: 0; font-size: 17px; }
  .answer-line strong { font-family: "Fraunces", Georgia, serif; font-size: 20px; }

  .meta {
    margin-top: 22px; padding-top: 14px; border-top: 2px dotted var(--line);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    color: var(--muted); font-size: 13px;
  }
  .link { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .link:hover { color: var(--ink); }
  .hidden { display: none !important; }
  #loader p { margin: 0 0 14px; }

  /* Animations */
  @keyframes wiggle {
    0%, 100% { transform: rotate(0) scale(1); }
    15% { transform: rotate(-9deg) scale(1.08); }
    30% { transform: rotate(8deg) scale(1.08); }
    45% { transform: rotate(-6deg) scale(1.05); }
    60% { transform: rotate(4deg) scale(1.03); }
    75% { transform: rotate(-2deg); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px) rotate(-2deg); }
    40% { transform: translateX(7px) rotate(2deg); }
    60% { transform: translateX(-5px) rotate(-1deg); }
    80% { transform: translateX(5px) rotate(1deg); }
  }
  @keyframes burst {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(.2); opacity: 0; }
  }
  @keyframes shard {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes pop-in {
    0% { transform: scale(.4); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes stamp {
    0% { transform: scale(2.2) rotate(-4deg); opacity: 0; }
    100% { transform: scale(1) rotate(-12deg); opacity: .9; }
  }
  @keyframes rise {
    from { transform: translateY(8px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .btn.wiggle { animation: wiggle .6s ease-in-out; }
  .btn.shake { animation: shake .35s ease-in-out; }
  .btn.burst { animation: burst .3s ease-in forwards; }
  .btn.pop-in { animation: pop-in .35s ease-out; }
  .answer-line.show { animation: rise .3s ease-out; }
  .shard {
    position: absolute; border-radius: 3px; background: var(--bad); pointer-events: none;
    animation: shard .7s cubic-bezier(.15, .7, .3, 1) forwards;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition: none !important; }
  }
  @media (max-width: 420px) {
    form { flex-direction: column; }
    .btn { width: 100%; }
    .stamp { font-size: 18px; }
  }
</style>
</head>
<body>
<main class="card">
  <div id="loader" class="hidden">
    <p class="eyebrow">Couldn't load questions.json automatically</p>
    <p>Browsers block pages opened straight from disk from reading other files.
       Run <strong>start.bat</strong> instead, or pick the file here (only needed once):</p>
    <input type="file" id="file" accept=".json,application/json">
  </div>

  <div id="quiz" class="hidden">
    <div class="top">
      <p class="eyebrow">Greetings from&hellip;</p>
      <div class="postmark" title="Higher weight = asked more often">Weight<b id="weight"></b></div>
    </div>
    <h1><span id="country"></span><span class="q">?</span></h1>

    <form id="form" autocomplete="off">
      <input type="text" id="answer" placeholder="Name the capital" aria-label="Capital city">
      <div class="btn-wrap" id="btn-wrap">
        <button type="submit" class="btn" id="btn">Check</button>
      </div>
    </form>
    <div class="result-row">
      <p id="result" class="answer-line" aria-live="polite"></p>
      <div id="stamp" class="stamp"></div>
    </div>

    <div class="meta">
      <span>Get it right and it comes up less often.</span>
      <button class="link" id="reset" type="button">Reset progress</button>
    </div>
  </div>
</main>

<script>
const STORAGE_KEY = 'capitalsQuiz';
const DEFAULT_WEIGHT = 10;
const MIN_WEIGHT = 1; // weights must never reach 0 or go negative
const STEP = 5;

const clampWeight = w => Math.max(MIN_WEIGHT, w);

// Accepts an array of objects, an object wrapping such an array, or a
// { country: capital } / { country: { capital, weight } } map.
function parseQuestions(json) {
  const pick = (obj, names) => {
    for (const key of Object.keys(obj)) {
      if (names.includes(key.toLowerCase())) return obj[key];
    }
  };
  let list = json;
  if (!Array.isArray(list)) {
    const nested = Object.values(json).find(Array.isArray);
    if (nested) {
      list = nested;
    } else {
      list = Object.entries(json).map(([country, v]) =>
        typeof v === 'object' ? { country, ...v } : { country, capital: v });
    }
  }
  return list.map(item => {
    const weight = Number(pick(item, ['weight']));
    return {
      country: String(pick(item, ['country', 'name', 'question']) ?? '').trim(),
      capital: String(pick(item, ['capital', 'city', 'answer']) ?? '').trim(),
      weight: clampWeight(Number.isFinite(weight) ? weight : DEFAULT_WEIGHT),
    };
  }).filter(q => q.country && q.capital);
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; } catch { return null; }
}

function save(items) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch {}
}

// Keep stored weights, but pick up any countries added to the JSON file.
function merge(stored, fresh) {
  const byCountry = new Map((stored || []).map(q => [q.country, q]));
  return fresh.map(q => {
    const old = byCountry.get(q.country);
    return old ? { ...q, weight: clampWeight(old.weight) } : q;
  });
}

function pickWeighted(items) {
  const total = items.reduce((sum, q) => sum + q.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) {
    r -= items[i].weight;
    if (r < 0) return i;
  }
  return items.length - 1;
}

const normalize = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

const $ = id => document.getElementById(id);

// Restarts a CSS animation class on an element.
function play(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function celebrate(btn) {
  btn.classList.add('good');
  btn.textContent = 'Next →';
  play(btn, 'wiggle');
}

// Shake, then shatter the button into shards and pop a fresh one back in.
function explode(btn, wrap) {
  play(btn, 'shake');
  btn.addEventListener('animationend', () => {
    const w = btn.offsetWidth, h = btn.offsetHeight;
    const cols = 5, rows = 3;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const s = document.createElement('span');
        s.className = 'shard';
        s.style.left = (c * w / cols) + 'px';
        s.style.top = (r * h / rows) + 'px';
        s.style.width = (w / cols) + 'px';
        s.style.height = (h / rows) + 'px';
        const angle = Math.atan2(r - (rows - 1) / 2, c - (cols - 1) / 2) + (Math.random() - .5);
        const dist = 50 + Math.random() * 70;
        s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        s.style.setProperty('--dy', Math.sin(angle) * dist + 20 + 'px');
        s.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        wrap.appendChild(s);
      }
    }
    play(btn, 'burst');
    setTimeout(() => {
      wrap.querySelectorAll('.shard').forEach(s => s.remove());
      btn.textContent = 'Next →';
      btn.classList.remove('burst');
      play(btn, 'pop-in');
      btn.focus();
    }, 700);
  }, { once: true });
}

function startQuiz(items) {
  $('loader').classList.add('hidden');
  $('quiz').classList.remove('hidden');

  const q = items[pickWeighted(items)];
  $('country').textContent = q.country;
  $('weight').textContent = q.weight;
  $('answer').focus();

  let answered = false;
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    if (answered) { location.reload(); return; }
    answered = true;

    // An empty answer counts as wrong.
    const guess = normalize($('answer').value);
    const accepted = q.capital.split(/[;/|]/).map(normalize);
    const correct = guess !== '' && accepted.includes(guess);
    q.weight = clampWeight(q.weight + (correct ? -STEP : STEP));
    save(items);

    $('answer').disabled = true;
    $('weight').textContent = q.weight;

    const stamp = $('stamp');
    stamp.textContent = correct ? 'Correct' : 'Wrong';
    stamp.className = 'stamp ' + (correct ? 'good' : 'bad');
    play(stamp, 'show');

    const result = $('result');
    result.innerHTML = '';
    result.append(correct ? 'Spot on — it\'s ' : 'The capital is ');
    const name = document.createElement('strong');
    name.textContent = q.capital;
    result.append(name, '.');
    play(result, 'show');

    if (correct) celebrate($('btn'));
    else explode($('btn'), $('btn-wrap'));
  });

  $('reset').addEventListener('click', () => {
    if (!confirm('Reset all weights?')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    location.reload();
  });
}

function showLoader(stored) {
  $('loader').classList.remove('hidden');
  $('file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const items = merge(stored, parseQuestions(JSON.parse(await file.text())));
      if (!items.length) throw new Error('No questions found');
      save(items);
      startQuiz(items);
    } catch (err) {
      alert('Could not read that file: ' + err.message);
    }
  });
}

(async function init() {
  const stored = load();
  try {
    const res = await fetch('questions.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const items = merge(stored, parseQuestions(await res.json()));
    if (!items.length) throw new Error('No questions found');
    save(items);
    startQuiz(items);
  } catch {
    // Opened from file:// (fetch blocked) or file unavailable: fall back to stored data.
    if (stored && stored.length) startQuiz(stored.map(q => ({ ...q, weight: clampWeight(q.weight) })));
    else showLoader(stored);
  }
})();
</script>
</body>
</html>
